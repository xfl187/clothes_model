openapi: 3.0.3
info:
  title: Clothes Model API
  version: 1.0.0
  description: Canonical V1 HTTP contract shared by the Backend, Android application, and Web Admin. Product behavior remains authoritative in the Product Spec.
  license:
    name: Proprietary
servers:
  - url: https://localhost
    description: Local or deployment origin
tags:
  - name: Health
    description: Process liveness and local dependency readiness.
  - name: Authentication
    description: App Token validation and Admin browser session lifecycle.
  - name: Uploads
    description: Resumable private file upload sessions.
  - name: Assets
    description: Private person, garment, mask, and generated-output metadata and content.
  - name: Jobs
    description: Try-on jobs, candidate JobItems, outputs, cancellation, and recovery commands.
  - name: Providers
    description: Provider availability, capabilities, and redacted Admin configuration.
  - name: Workflows
    description: Immutable ComfyUI Workflow versions and lifecycle actions.
  - name: Admin Configuration
    description: Explicit runtime configuration resources maintained by Web Admin.
  - name: Storage
    description: Capacity status, cleanup preview, and confirmed cleanup commands.
  - name: Diagnostics
    description: Redacted, timestamped operational diagnostics for administrators.
paths:
  /health/live:
    get:
      tags:
        - Health
      operationId: getLiveness
      summary: Report whether the process is alive
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      tags:
        - Health
      operationId: getReadiness
      summary: Report whether required local dependencies are ready
      security: []
      responses:
        '200':
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/status:
    get:
      tags:
        - Authentication
      operationId: getAppAuthStatus
      summary: Validate the App Token without returning secret material
      security:
        - AppBearer: []
      responses:
        '200':
          description: App Token is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppAuthStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/auth/session:
    post:
      tags:
        - Authentication
      operationId: createAdminSession
      summary: Exchange the Admin Token for a secure browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSessionCreateRequest'
      responses:
        '201':
          description: Session created. The session identifier is set in an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
        - Authentication
      operationId: deleteAdminSession
      summary: End the current admin browser session
      security:
        - AdminSession: []
          AdminCsrf: []
      responses:
        '204':
          description: Session ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/uploads:
    post:
      tags:
        - Uploads
      operationId: createUploadSession
      summary: Create a resumable upload session
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreateRequest'
      responses:
        '201':
          description: Upload session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
        '507':
          $ref: '#/components/responses/StorageBlocked'
  /api/v1/uploads/{upload_id}:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Uploads
      operationId: getUploadSession
      summary: Read resumable upload progress
      security:
        - AppBearer: []
      responses:
        '200':
          description: Current upload state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
        - Uploads
      operationId: cancelUploadSession
      summary: Cancel an incomplete upload and discard temporary bytes
      security:
        - AppBearer: []
      responses:
        '200':
          description: Upload cancelled or already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/uploads/{upload_id}/content:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    patch:
      tags:
        - Uploads
      operationId: appendUploadContent
      summary: Append bytes at the server-confirmed upload offset
      security:
        - AppBearer: []
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Bytes appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadChunkResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/uploads/{upload_id}/complete:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Uploads
      operationId: completeUploadSession
      summary: Validate an uploaded file and create its Asset
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCompleteRequest'
      responses:
        '201':
          description: Upload completed and Asset created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/assets:
    get:
      tags:
        - Assets
      operationId: listAssets
      summary: List reusable person, garment, result, or mask assets
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AssetKind'
      responses:
        '200':
          description: Asset page ordered by created_at and id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/assets/{asset_id}:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Assets
      operationId: getAsset
      summary: Read asset metadata, including deleted-content placeholders
      security:
        - AppBearer: []
      responses:
        '200':
          description: Asset metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/assets/{asset_id}/content:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Assets
      operationId: downloadAssetContent
      summary: Download private asset content through an authenticated endpoint
      security:
        - AppBearer: []
        - AdminSession: []
      responses:
        '200':
          description: Private image bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/jobs:
    get:
      tags:
        - Jobs
      operationId: listJobs
      summary: List jobs ordered by created_at and id
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/JobState'
      responses:
        '200':
          description: Job page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Jobs
      operationId: createJob
      summary: Create a try-on job and lock generation configuration versions
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Persisted job, including locked Provider and Workflow references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TryOnJob'
              examples:
                waitingProvider:
                  $ref: '#/components/examples/WaitingProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '507':
          $ref: '#/components/responses/StorageBlocked'
  /api/v1/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Jobs
      operationId: getJob
      summary: Read authoritative job, item, output, and locked-version state
      security:
        - AppBearer: []
      responses:
        '200':
          description: Job details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TryOnJob'
              examples:
                waitingProvider:
                  $ref: '#/components/examples/WaitingProvider'
                partiallySucceeded:
                  $ref: '#/components/examples/PartiallySucceeded'
                needsAttention:
                  $ref: '#/components/examples/NeedsAttention'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/jobs/{job_id}/cancel:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Jobs
      operationId: cancelJob
      summary: Best-effort cancel every unfinished candidate while retaining successful outputs
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated aggregate job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCommandResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/job-items/{job_item_id}:
    parameters:
      - name: job_item_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Jobs
      operationId: getJobItem
      summary: Read one candidate execution and its immutable attempt lineage
      security:
        - AppBearer: []
      responses:
        '200':
          description: Job item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/job-items/{job_item_id}/cancel:
    parameters:
      - name: job_item_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Jobs
      operationId: cancelJobItem
      summary: Best-effort cancel one unfinished candidate without affecting others
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated aggregate job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCommandResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/job-items/{job_item_id}/retry:
    parameters:
      - name: job_item_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Jobs
      operationId: retryJobItem
      summary: Create a new traceable JobItem attempt without overwriting the original
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryJobItemRequest'
      responses:
        '201':
          description: New JobItem created in queued state and aggregate job recalculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCommandResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/job-items/{job_item_id}/requery:
    parameters:
      - name: job_item_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Jobs
      operationId: requeryJobItem
      summary: Requery an uncertain external execution without starting a new one
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Job synchronized with the known external state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCommandResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/job-items/{job_item_id}/finish-failed:
    parameters:
      - name: job_item_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Jobs
      operationId: finishJobItemAsFailed
      summary: End needs_attention processing as a retained failure
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishFailedRequest'
      responses:
        '200':
          description: JobItem ended as failed and aggregate job recalculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCommandResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/providers:
    get:
      tags:
        - Providers
      operationId: listAvailableProviders
      summary: List providers and capability snapshots available for new jobs
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Provider page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPage'
              examples:
                availableProviders:
                  $ref: '#/components/examples/AvailableProviderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/provider-configs:
    get:
      tags:
        - Providers
      operationId: listProviderConfigs
      summary: List redacted provider configurations
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Provider configuration page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConfigPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Providers
      operationId: createProviderConfig
      summary: Save a new inactive provider configuration without changing the default
      security:
        - AdminSession: []
          AdminCsrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderConfigRequest'
      responses:
        '201':
          description: Inactive provider configuration created; secret value is not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/provider-configs/{provider_id}:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Providers
      operationId: getProviderConfig
      summary: Read a redacted provider configuration and capability snapshot
      security:
        - AdminSession: []
      responses:
        '200':
          description: Redacted provider configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags:
        - Providers
      operationId: updateProviderConfig
      summary: Create the next immutable configuration revision
      security:
        - AdminSession: []
          AdminCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderConfigRequest'
      responses:
        '200':
          description: New configuration revision saved without changing the default.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/provider-configs/{provider_id}/validate:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Providers
      operationId: validateProviderConfig
      summary: Run connection, capability, and minimal generation checks
      security:
        - AdminSession: []
          AdminCsrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Validation result; testing does not enable or select the provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderValidationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/provider-configs/{provider_id}/enable:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Providers
      operationId: enableProviderConfig
      summary: Enable a validated provider configuration without changing the default
      security:
        - AdminSession: []
          AdminCsrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Provider configuration enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/workflows:
    get:
      tags:
        - Workflows
      operationId: listWorkflowVersions
      summary: List immutable Workflow versions
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Workflow version page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Workflows
      operationId: createWorkflowVersion
      summary: Upload a new immutable draft Workflow version
      security:
        - AdminSession: []
          AdminCsrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowCreateRequest'
      responses:
        '201':
          description: Draft Workflow version created; existing versions are unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/workflows/{workflow_version_id}:
    parameters:
      - name: workflow_version_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Workflows
      operationId: getWorkflowVersion
      summary: Read an immutable Workflow version and its validation state
      security:
        - AdminSession: []
      responses:
        '200':
          description: Workflow version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/workflows/{workflow_version_id}/validate:
    parameters:
      - name: workflow_version_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Workflows
      operationId: validateWorkflowVersion
      summary: Validate bindings, capabilities, compatibility, and minimal test execution
      security:
        - AdminSession: []
          AdminCsrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Workflow validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowValidationResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/workflows/{workflow_version_id}/activate:
    parameters:
      - name: workflow_version_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Workflows
      operationId: activateWorkflowVersion
      summary: Activate a validated version for new jobs and retire the previous active version
      security:
        - AdminSession: []
          AdminCsrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowActivateRequest'
      responses:
        '200':
          description: Workflow version activated; existing jobs retain their locked version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/configuration/default-provider:
    get:
      tags:
        - Admin Configuration
      operationId: getDefaultProviderConfiguration
      summary: Read the Provider selection applied to new jobs
      security:
        - AdminSession: []
      responses:
        '200':
          description: Current default Provider configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultProviderConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Admin Configuration
      operationId: updateDefaultProviderConfiguration
      summary: Change the default for new jobs without modifying existing locked jobs
      security:
        - AdminSession: []
          AdminCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefaultProviderUpdateRequest'
      responses:
        '200':
          description: Default Provider updated for new jobs only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultProviderConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/configuration/comfy-node:
    get:
      tags:
        - Admin Configuration
      operationId: getComfyNodeConfiguration
      summary: Read the single redacted ComfyUI node configuration
      security:
        - AdminSession: []
      responses:
        '200':
          description: Redacted node configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComfyNodeConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Admin Configuration
      operationId: updateComfyNodeConfiguration
      summary: Replace the single ComfyUI physical-node configuration
      security:
        - AdminSession: []
          AdminCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComfyNodeConfigurationRequest'
      responses:
        '200':
          description: Node configuration saved; credentials are not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComfyNodeConfiguration'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/configuration/comfy-node/test:
    post:
      tags:
        - Admin Configuration
      operationId: testComfyNodeConnection
      summary: Test connectivity without enabling the node or changing locked jobs
      security:
        - AdminSession: []
          AdminCsrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Connection test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/configuration/retention:
    get:
      tags:
        - Admin Configuration
      operationId: getRetentionPolicy
      summary: Read runtime retention policy
      security:
        - AdminSession: []
      responses:
        '200':
          description: Current retention policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
        - Admin Configuration
      operationId: updateRetentionPolicy
      summary: Update future cleanup eligibility rules
      security:
        - AdminSession: []
          AdminCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionPolicyUpdateRequest'
      responses:
        '200':
          description: Retention policy updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/storage:
    get:
      tags:
        - Storage
      operationId: getStorageStatus
      summary: Read capacity and whether new uploads and jobs are accepted
      security:
        - AdminSession: []
      responses:
        '200':
          description: Storage status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageStatus'
              examples:
                blocked:
                  $ref: '#/components/examples/Blocked'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/storage/scan:
    post:
      tags:
        - Storage
      operationId: scanStorage
      summary: Preview reclaimable files without deleting content
      security:
        - AdminSession: []
          AdminCsrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageScanRequest'
      responses:
        '200':
          description: Cleanup preview including protected references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageScanResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/storage/cleanup:
    post:
      tags:
        - Storage
      operationId: cleanupStorage
      summary: Delete files from a confirmed scan while preserving protected references
      security:
        - AdminSession: []
          AdminCsrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupRequest'
      responses:
        '200':
          description: Cleanup result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/admin/diagnostics/jobs:
    get:
      tags:
        - Diagnostics
      operationId: listDiagnosticJobs
      summary: List redacted job diagnostics from a timestamped snapshot
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/JobState'
      responses:
        '200':
          description: Diagnostic job page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticJobPage'
              examples:
                snapshot:
                  $ref: '#/components/examples/JobPageSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/diagnostics/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Diagnostics
      operationId: getDiagnosticJob
      summary: Read redacted lineage, locked versions, errors, and external execution metadata
      security:
        - AdminSession: []
      responses:
        '200':
          description: Redacted diagnostic details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticJobDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    AppBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-app-token
      description: High-entropy App Token used only by the Android application.
    AdminSession:
      type: apiKey
      in: cookie
      name: clothes_admin_session
      description: Secure HttpOnly SameSite admin session cookie.
    AdminCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the admin session for state-changing requests.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque client-generated key. Reusing a key with a different payload returns idempotency_key_reused.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor returned by the previous page.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Problem:
      description: Request failed with a stable machine-readable error code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            invalidToken:
              $ref: '#/components/examples/Unauthorized'
    StorageBlocked:
      description: New uploads or jobs are blocked because storage capacity is insufficient.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            storageCapacity:
              $ref: '#/components/examples/StorageCapacity'
  schemas:
    Timestamp:
      type: string
      format: date-time
      description: UTC RFC 3339 timestamp.
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - checked_at
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        checked_at:
          $ref: '#/components/schemas/Timestamp'
        checks:
          type: object
          additionalProperties:
            type: string
          description: Safe component conclusions without filesystem paths or secrets.
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - detail
      properties:
        field:
          type: string
        code:
          type: string
        detail:
          type: string
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
        - trace_id
        - retryable
        - field_errors
        - context
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Stable machine-readable error code. Clients must not branch on detail text.
        detail:
          type: string
          description: Safe Chinese user-facing explanation.
        trace_id:
          type: string
        retryable:
          type: boolean
        field_errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        context:
          type: object
          additionalProperties: true
          description: Safe structured context only; never contains secrets or raw provider payloads.
    AppAuthStatus:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - token_id
        - server_time
      properties:
        authenticated:
          type: boolean
          enum:
            - true
        token_id:
          type: string
          description: Non-secret token identifier; never the token value.
        server_time:
          $ref: '#/components/schemas/Timestamp'
    AdminSessionCreateRequest:
      type: object
      additionalProperties: false
      required:
        - admin_token
      properties:
        admin_token:
          type: string
          minLength: 32
          writeOnly: true
    AdminSession:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - csrf_token
        - created_at
        - expires_at
      properties:
        authenticated:
          type: boolean
          enum:
            - true
        csrf_token:
          type: string
          writeOnly: true
          description: Returned in the login response and required for subsequent admin writes.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    AssetKind:
      type: string
      enum:
        - person
        - garment
        - generated_output
        - mask
        - workflow_file
        - unknown
    GarmentCategory:
      type: string
      enum:
        - upper_body
        - lower_body
        - dress
        - unknown
    GarmentSource:
      type: string
      enum:
        - photo
        - screenshot
        - product_image
        - experimental
        - unknown
    UploadCreateRequest:
      type: object
      additionalProperties: false
      required:
        - asset_kind
        - filename
        - content_type
        - size_bytes
      properties:
        asset_kind:
          $ref: '#/components/schemas/AssetKind'
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        garment_category:
          $ref: '#/components/schemas/GarmentCategory'
        garment_source:
          $ref: '#/components/schemas/GarmentSource'
    Identifier:
      type: string
      format: uuid
      description: Server-issued UUIDv7 represented as a canonical UUID string.
    UploadState:
      type: string
      enum:
        - created
        - uploading
        - completed
        - failed
        - cancelled
        - unknown
    UploadSession:
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - asset_kind
        - filename
        - content_type
        - size_bytes
        - uploaded_bytes
        - created_at
        - expires_at
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        state:
          $ref: '#/components/schemas/UploadState'
        asset_kind:
          $ref: '#/components/schemas/AssetKind'
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        uploaded_bytes:
          type: integer
          format: int64
          minimum: 0
        asset_id:
          type: string
          format: uuid
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        error:
          $ref: '#/components/schemas/ProblemDetails'
    UploadChunkResult:
      type: object
      additionalProperties: false
      required:
        - upload_id
        - state
        - uploaded_bytes
      properties:
        upload_id:
          $ref: '#/components/schemas/Identifier'
        state:
          $ref: '#/components/schemas/UploadState'
        uploaded_bytes:
          type: integer
          format: int64
          minimum: 0
    UploadCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - sha256
      properties:
        sha256:
          type: string
          pattern: ^[A-Fa-f0-9]{64}$
    Asset:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - content_type
        - size_bytes
        - width
        - height
        - favorite
        - lifecycle
        - created_at
        - content_available
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        kind:
          $ref: '#/components/schemas/AssetKind'
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        favorite:
          type: boolean
        lifecycle:
          type: string
          enum:
            - active
            - deleted_content
            - expired
            - unknown
        created_at:
          $ref: '#/components/schemas/Timestamp'
        content_available:
          type: boolean
        quality_warnings:
          type: array
          items:
            type: string
        garment_category:
          $ref: '#/components/schemas/GarmentCategory'
        garment_source:
          $ref: '#/components/schemas/GarmentSource'
    AssetPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    JobState:
      type: string
      enum:
        - queued
        - waiting_provider
        - preparing
        - running
        - needs_attention
        - succeeded
        - partially_succeeded
        - failed
        - cancelled
        - unknown
    TryOnMode:
      type: string
      enum:
        - precise_try_on
        - unknown
    GenerationOptions:
      type: object
      additionalProperties: false
      required:
        - candidate_count
      properties:
        candidate_count:
          type: integer
          minimum: 1
          maximum: 4
        seed:
          type: integer
          format: int64
          nullable: true
        advanced_parameters:
          type: object
          additionalProperties: true
    JobBlockReason:
      type: string
      enum:
        - provider_offline
        - storage_capacity
        - retry_backoff
        - locked_configuration_unavailable
        - external_state_unknown
        - configuration_invalid
        - unknown
    ProviderConfigRef:
      type: object
      additionalProperties: false
      required:
        - provider_id
        - config_version_id
        - revision
      properties:
        provider_id:
          $ref: '#/components/schemas/Identifier'
        config_version_id:
          $ref: '#/components/schemas/Identifier'
        revision:
          type: integer
          minimum: 1
    VersionSnapshot:
      type: object
      additionalProperties: false
      required:
        - label
      properties:
        label:
          type: string
          description: Read-only display label captured when the owning resource was created.
    WorkflowVersionRef:
      type: object
      additionalProperties: false
      required:
        - workflow_id
        - workflow_version_id
        - version
      properties:
        workflow_id:
          type: string
          minLength: 1
          maxLength: 100
        workflow_version_id:
          $ref: '#/components/schemas/Identifier'
        version:
          type: integer
          minimum: 1
    JobItemState:
      type: string
      enum:
        - queued
        - waiting_provider
        - preparing
        - running
        - needs_attention
        - succeeded
        - failed
        - cancelled
        - unknown
    GeneratedOutput:
      type: object
      additionalProperties: false
      required:
        - id
        - job_item_id
        - asset_id
        - favorite
        - content_available
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        job_item_id:
          $ref: '#/components/schemas/Identifier'
        asset_id:
          $ref: '#/components/schemas/Identifier'
        favorite:
          type: boolean
        content_available:
          type: boolean
        seed:
          type: integer
          format: int64
          nullable: true
        actual_parameters:
          type: object
          additionalProperties: true
        quality_warnings:
          type: array
          items:
            type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
    JobItem:
      type: object
      additionalProperties: false
      required:
        - id
        - job_id
        - person_asset_id
        - candidate_index
        - state
        - attempt
        - outputs
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        job_id:
          $ref: '#/components/schemas/Identifier'
        person_asset_id:
          $ref: '#/components/schemas/Identifier'
        candidate_index:
          type: integer
          minimum: 0
        state:
          $ref: '#/components/schemas/JobItemState'
        block_reason:
          $ref: '#/components/schemas/JobBlockReason'
        attempt:
          type: integer
          minimum: 1
        retry_of_job_item_id:
          type: string
          format: uuid
        external_execution_id:
          type: string
          nullable: true
          description: Safe provider execution identifier; provider credentials are never included.
        next_attempt_at:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/ProblemDetails'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedOutput'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    TryOnJob:
      type: object
      additionalProperties: false
      required:
        - id
        - person_asset_ids
        - garment_asset_id
        - mode
        - generation_options
        - state
        - provider_config_ref
        - provider_snapshot
        - items
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        person_asset_ids:
          type: array
          items:
            $ref: '#/components/schemas/Identifier'
        garment_asset_id:
          $ref: '#/components/schemas/Identifier'
        mask_asset_id:
          type: string
          format: uuid
        related_job_id:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/TryOnMode'
        generation_options:
          $ref: '#/components/schemas/GenerationOptions'
        state:
          $ref: '#/components/schemas/JobState'
        block_reason:
          $ref: '#/components/schemas/JobBlockReason'
        blocked_detail:
          type: string
          nullable: true
        provider_config_ref:
          $ref: '#/components/schemas/ProviderConfigRef'
        provider_snapshot:
          $ref: '#/components/schemas/VersionSnapshot'
        workflow_version_ref:
          $ref: '#/components/schemas/WorkflowVersionRef'
        workflow_snapshot:
          $ref: '#/components/schemas/VersionSnapshot'
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobItem'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    JobPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - has_more
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TryOnJob'
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
    CreateJobRequest:
      type: object
      additionalProperties: false
      required:
        - person_asset_ids
        - garment_asset_id
        - provider_id
        - mode
        - generation_options
      properties:
        person_asset_ids:
          type: array
          minItems: 1
          maxItems: 1
          description: V1 submits one person asset while preserving the future-safe list shape.
          items:
            $ref: '#/components/schemas/Identifier'
        garment_asset_id:
          $ref: '#/components/schemas/Identifier'
        mask_asset_id:
          type: string
          format: uuid
        provider_id:
          $ref: '#/components/schemas/Identifier'
        mode:
          $ref: '#/components/schemas/TryOnMode'
        generation_options:
          $ref: '#/components/schemas/GenerationOptions'
        related_job_id:
          type: string
          format: uuid
          description: Links a mask-correction job to the original job without overwriting it.
    JobCommandResult:
      type: object
      additionalProperties: false
      required:
        - job
      properties:
        job:
          $ref: '#/components/schemas/TryOnJob'
        created_job_item_id:
          type: string
          format: uuid
    RetryJobItemRequest:
      type: object
      additionalProperties: false
      properties:
        provider_id:
          type: string
          format: uuid
          description: Explicit compatible provider selection when the locked provider cannot be reused.
        reason:
          type: string
          nullable: true
    FinishFailedRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ProviderType:
      type: string
      enum:
        - llm_image_edit
        - comfyui
        - unknown
    ProviderAvailability:
      type: string
      enum:
        - available
        - temporarily_offline
        - unavailable_configuration
        - disabled
        - unknown
    CapabilitySource:
      type: string
      enum:
        - adapter
        - workflow_declared
        - derived
        - unknown
    CapabilityVerification:
      type: string
      enum:
        - verified
        - declared
        - unavailable
        - unknown
    CapabilityValues:
      type: object
      additionalProperties: false
      required:
        - values
        - source
        - verification
      properties:
        values:
          type: array
          items:
            type: string
        source:
          $ref: '#/components/schemas/CapabilitySource'
        verification:
          $ref: '#/components/schemas/CapabilityVerification'
        note:
          type: string
          nullable: true
    CapabilityFlag:
      type: object
      additionalProperties: false
      required:
        - supported
        - source
        - verification
      properties:
        supported:
          type: boolean
        source:
          $ref: '#/components/schemas/CapabilitySource'
        verification:
          $ref: '#/components/schemas/CapabilityVerification'
        note:
          type: string
          nullable: true
    ImageConstraints:
      type: object
      additionalProperties: false
      required:
        - content_types
        - max_size_bytes
      properties:
        content_types:
          type: array
          minItems: 1
          items:
            type: string
        min_width:
          type: integer
          minimum: 1
          nullable: true
        min_height:
          type: integer
          minimum: 1
          nullable: true
        max_width:
          type: integer
          minimum: 1
          nullable: true
        max_height:
          type: integer
