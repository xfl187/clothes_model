        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishFailedRequest'
      responses:
        '200':
          description: JobItem ended as failed and aggregate job recalculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCommandResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/JobStateConflict'
  /api/v1/outfits:
    get:
      tags:
        - Outfits
      operationId: listOutfitSessions
      summary: List outfit sessions for the current owner
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Outfit session page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitSessionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Outfits
      operationId: createOutfitSession
      summary: Create a layered-outfit session from one original person image
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOutfitSessionRequest'
      responses:
        '201':
          description: Session created with a locked layer-definition version and an initial main branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/outfits/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Outfits
      operationId: getOutfitSession
      summary: Read a session with its branches and current confirmed revision
      security:
        - AppBearer: []
      responses:
        '200':
          description: Outfit session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags:
        - Outfits
      operationId: updateOutfitSession
      summary: Rename or favorite a session
      security:
        - AppBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOutfitSessionRequest'
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
        - Outfits
      operationId: deleteOutfitSession
      summary: Delete a whole session after confirming revision and result impact
      security:
        - AppBearer: []
      responses:
        '204':
          description: Session deleted; shared assets and other sessions are unchanged.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/outfits/{session_id}/branches:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Outfits
      operationId: createOutfitBranch
      summary: Create a branch from an optional base revision or the original person image
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOutfitBranchRequest'
      responses:
        '201':
          description: Branch created; no generation task or fee is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/outfits/{session_id}/branches/{branch_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: branch_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    patch:
      tags:
        - Outfits
      operationId: updateOutfitBranch
      summary: Rename, favorite, or set a branch as the current mainline
      description: Setting mainline moves the session mainline. A branch with unfinished tasks cannot be deleted, and the current mainline must be changed before it can be deleted.
      security:
        - AppBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOutfitBranchRequest'
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
        - Outfits
      operationId: deleteOutfitBranch
      summary: Delete a branch without cascading into shared assets or other branches
      security:
        - AppBearer: []
      responses:
        '200':
          description: Branch deleted; updated session returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/outfits/{session_id}/branches/{branch_id}/layers:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: branch_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Outfits
      operationId: addOutfitLayer
      summary: Add a garment layer by creating a linked single-garment try-on job
      description: Requires a Provider that declares sequential layering and the target layer role. Adding a middle layer marks subsequent layers pending_reapply; no later task is created automatically.
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOutfitLayerRequest'
      responses:
        '201':
          description: Layer job created and linked to the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitLayerResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/ProviderNotUsable'
  /api/v1/outfits/{session_id}/branches/{branch_id}/layers/{layer_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: branch_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: layer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    delete:
      tags:
        - Outfits
      operationId: removeOutfitLayer
      summary: Remove or revert a layer and mark subsequent layers pending_reapply
      security:
        - AppBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveOutfitLayerRequest'
      responses:
        '200':
          description: Updated session; no automatic generation or fee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/outfits/{session_id}/branches/{branch_id}/layers/{layer_id}/reapply:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: branch_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: layer_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Outfits
      operationId: reapplyOutfitLayer
      summary: Reapply a pending layer, preferring the original Provider and parameters
      description: Always creates a new traceable job. If the original Provider is unavailable or incompatible, an explicit compatible Provider must be supplied; otherwise the layer stays pending_reapply and no job is created.
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReapplyOutfitLayerRequest'
      responses:
        '201':
          description: Reapply job created and linked to the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitLayerResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/ProviderNotUsable'
  /api/v1/outfits/{session_id}/branches/{branch_id}/revisions/{revision_id}/select:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: branch_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      - name: revision_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Outfits
      operationId: selectOutfitRevision
      summary: Commit a new immutable revision from an explicit candidate selection
      description: Only an explicit candidate selection commits a new confirmed revision. Failed, cancelled, or needs_attention attempts never change the current revision.
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectOutfitRevisionRequest'
      responses:
        '200':
          description: New confirmed revision committed; updated session returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/JobStateConflict'
  /api/v1/outfits/{session_id}/route:
    parameters:
      - name: session_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Outfits
      operationId: switchOutfitRoute
      summary: Switch split/dress route by creating a new branch from the original person image
      description: Removes route-conflicting layers and keeps compatible outerwear as pending_reapply. The original branch is unchanged, and no generation task or fee is created by the switch.
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchOutfitRouteRequest'
      responses:
        '200':
          description: New branch created for the target route; updated session returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutfitSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    AppBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-app-token
      description: High-entropy App Token used only by the Android application.
    AdminSession:
      type: apiKey
      in: cookie
      name: clothes_admin_session
      description: Secure HttpOnly SameSite admin session cookie.
    AdminCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the admin session for state-changing requests. The value is returned by session creation or inspection and must remain in Web memory rather than browser storage.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque client-generated key bound to the authenticated actor, operation, and canonical request payload. A successful replay returns the original stable result. Reusing a key with a different payload returns idempotency_key_reused. Streaming append is instead guarded by the server-confirmed Upload-Offset.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor returned by the previous page.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Problem:
      description: Request failed with a stable machine-readable error code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    JobStateConflict:
      description: The command is not allowed from the current job or item state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            jobStateConflict:
              $ref: '#/components/examples/JobStateConflict'
    ProviderNotUsable:
      description: The selected provider is disabled, unavailable, or capability-incompatible.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            providerNotUsable:
              $ref: '#/components/examples/ProviderNotUsable'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            invalidToken:
              $ref: '#/components/examples/Unauthorized'
    Forbidden:
      description: The authenticated principal does not have the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            wrongScope:
              $ref: '#/components/examples/WrongScope'
    CsrfRejected:
      description: The admin write was rejected by CSRF or same-origin validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            csrfRejected:
              $ref: '#/components/examples/CsrfRejected'
    RateLimited:
      description: Authentication attempts are temporarily throttled.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            authenticationThrottled:
              $ref: '#/components/examples/AuthenticationThrottled'
    IdempotencyConflict:
      description: The idempotency key was already bound to a different request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            idempotencyConflict:
              $ref: '#/components/examples/IdempotencyConflict'
    UploadOffsetConflict:
      description: The supplied upload offset does not match the confirmed server offset.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            uploadOffsetConflict:
              $ref: '#/components/examples/UploadOffsetConflict'
    AssetReferenced:
      description: Asset content cannot be deleted while active references exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            assetReferenced:
              $ref: '#/components/examples/AssetReferenced'
    InvalidImage:
      description: Uploaded bytes do not satisfy the private image boundary.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            invalidImage:
              $ref: '#/components/examples/InvalidImage'
    StorageBlocked:
      description: New uploads or jobs are blocked because storage capacity is insufficient.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            storageCapacity:
              $ref: '#/components/examples/StorageCapacity'
  schemas:
    Timestamp:
      type: string
      format: date-time
      description: UTC RFC 3339 timestamp.
    ProductRelease:
      type: string
      enum:
        - v1
        - v1_1
      description: Server-authoritative product release track for exposed behavior.
    ProductFeature:
      type: string
      enum:
        - direct_model_try_on
        - comfyui
        - layered_outfits
      description: Stable product feature enabled for this deployment release track.
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - checked_at
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        checked_at:
          $ref: '#/components/schemas/Timestamp'
        product_release:
          description: Active server-authoritative product release track.
          allOf:
            - $ref: '#/components/schemas/ProductRelease'
        enabled_features:
          type: array
          uniqueItems: true
          description: Stable product features enabled for the active release track.
          items:
            $ref: '#/components/schemas/ProductFeature'
        checks:
          type: object
          additionalProperties:
            type: string
          description: Safe component conclusions without filesystem paths or secrets.
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - detail
      properties:
        field:
          type: string
        code:
          type: string
        detail:
          type: string
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
        - trace_id
        - retryable
        - field_errors
        - context
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Stable machine-readable error code. Clients must not branch on detail text.
        detail:
          type: string
          description: Safe Chinese user-facing explanation.
        trace_id:
          type: string
        retryable:
          type: boolean
        field_errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        context:
          type: object
          additionalProperties: true
          description: Safe structured context only; never contains secrets or raw provider payloads.
    AppAuthStatus:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - token_id
        - server_time
      properties:
        authenticated:
          type: boolean
          enum:
            - true
        token_id:
          type: string
          description: Non-secret token identifier; never the token value.
        server_instance_id:
          type: string
          format: uuid
          readOnly: true
          description: Stable opaque identity for this Backend installation. Local clients use it only as a partition key and must not derive trust from its value.
        owner_scope_id:
          type: string
          format: uuid
          readOnly: true
          description: Stable opaque material-owner scope associated with the App credential. It is independent of token rotation and reserves future account isolation.
        server_time:
          $ref: '#/components/schemas/Timestamp'
    AdminSession:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - csrf_token
        - created_at
        - expires_at
      properties:
        authenticated:
          type: boolean
          enum:
            - true
        csrf_token:
          type: string
          readOnly: true
          minLength: 32
          description: Returned by session creation or inspection and required for subsequent admin writes. Web clients keep it in memory only.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    AdminSessionCreateRequest:
      type: object
      additionalProperties: false
      required:
        - admin_token
      properties:
        admin_token:
          type: string
          minLength: 32
          writeOnly: true
    AppCredentialStatus:
      type: object
      additionalProperties: false
      required:
        - token_id
        - status
        - created_at
      properties:
        token_id:
          type: string
          description: Non-secret token identifier; never the token value.
        status:
          type: string
          enum:
            - active
            - unknown
        created_at:
          $ref: '#/components/schemas/Timestamp'
        rotated_at:
          $ref: '#/components/schemas/Timestamp'
    AppCredentialRotation:
      type: object
      additionalProperties: false
      required:
        - token
        - token_id
        - rotated_at
      properties:
        token:
          type: string
          description: One-time plaintext App Token. It is shown once and never returned again; the previous token is invalid immediately.
        token_id:
          type: string
        rotated_at:
          $ref: '#/components/schemas/Timestamp'
    AssetKind:
      type: string
      enum:
        - person
        - garment
        - generated_output
        - mask
        - workflow_file
        - unknown
    GarmentCategory:
      type: string
      enum:
        - upper_body
        - lower_body
        - dress
        - unknown
    GarmentSource:
      type: string
      enum:
        - photo
        - screenshot
        - product_image
        - experimental
        - unknown
    Identifier:
      type: string
      format: uuid
      description: Server-issued UUIDv7 represented as a canonical UUID string.
    UploadCreateRequest:
      type: object
      additionalProperties: false
      required:
        - asset_kind
        - filename
        - content_type
        - size_bytes
      properties:
        asset_kind:
          $ref: '#/components/schemas/AssetKind'
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        garment_category:
          $ref: '#/components/schemas/GarmentCategory'
        garment_source:
          $ref: '#/components/schemas/GarmentSource'
        target_asset_id:
          allOf:
            - $ref: '#/components/schemas/Identifier'
          description: Existing owned person or garment logical asset whose absent input content will be rehydrated. Omit when creating a new logical asset.
    UploadState:
      type: string
      enum:
        - created
        - uploading
        - completed
        - failed
        - cancelled
        - unknown
    UploadSession:
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - asset_kind
        - filename
        - content_type
        - size_bytes
        - uploaded_bytes
        - created_at
        - expires_at
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        state:
          $ref: '#/components/schemas/UploadState'
        asset_kind:
          $ref: '#/components/schemas/AssetKind'
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        uploaded_bytes:
          type: integer
          format: int64
          minimum: 0
        asset_id:
          type: string
          format: uuid
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        error:
          $ref: '#/components/schemas/ProblemDetails'
    UploadChunkResult:
      type: object
      additionalProperties: false
      required:
        - upload_id
        - state
        - uploaded_bytes
      properties:
        upload_id:
          $ref: '#/components/schemas/Identifier'
        state:
          $ref: '#/components/schemas/UploadState'
        uploaded_bytes:
          type: integer
          format: int64
          minimum: 0
    UploadCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - sha256
      properties:
        sha256:
          type: string
          pattern: ^[A-Fa-f0-9]{64}$
    Asset:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - content_type
        - size_bytes
        - width
        - height
        - favorite
        - lifecycle
        - created_at
        - content_available
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        kind:
          $ref: '#/components/schemas/AssetKind'
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        favorite:
          type: boolean
        lifecycle:
