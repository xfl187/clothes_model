openapi: 3.0.3
info:
  title: Clothes Model API
  version: 1.0.0
  description: Canonical V1 HTTP contract shared by the Backend, Android application, and Web Admin. Product behavior remains authoritative in the Product Spec. Cursor values, resource-version values, and ETags are opaque to clients and must only be replayed in the boundary that produced them. Content hashes are internal storage identities and are never exposed as resource versions.
  license:
    name: Proprietary
servers:
  - url: https://localhost
    description: Local or deployment origin
tags:
  - name: Health
    description: Process liveness and local dependency readiness.
  - name: Authentication
    description: App Token validation and Admin browser session lifecycle.
  - name: Uploads
    description: Resumable private file upload sessions.
  - name: Assets
    description: Private person, garment, mask, and generated-output metadata and content.
  - name: Jobs
    description: Try-on jobs, candidate JobItems, outputs, cancellation, and recovery commands.
  - name: Providers
    description: Provider availability, capabilities, and redacted Admin configuration.
  - name: Workflows
    description: Immutable ComfyUI Workflow versions and lifecycle actions.
  - name: Admin Configuration
    description: Explicit runtime configuration resources maintained by Web Admin.
  - name: Storage
    description: Capacity status, cleanup preview, and confirmed cleanup commands.
  - name: Diagnostics
    description: Redacted, timestamped operational diagnostics for administrators.
  - name: Outfits
    description: V1.1 layered-outfit sessions, branches, revisions, and layers.
paths:
  /health/live:
    get:
      tags:
        - Health
      operationId: getLiveness
      summary: Report whether the process is alive
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /health/ready:
    get:
      tags:
        - Health
      operationId: getReadiness
      summary: Report whether required local dependencies are ready
      security: []
      responses:
        '200':
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/status:
    get:
      tags:
        - Authentication
      operationId: getAppAuthStatus
      summary: Validate the App Token without returning secret material
      security:
        - AppBearer: []
      responses:
        '200':
          description: App Token is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppAuthStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/auth/session:
    get:
      tags:
        - Authentication
      operationId: getAdminSession
      summary: Restore an authenticated Admin browser session and refresh its CSRF value
      description: Uses the HttpOnly session cookie. The returned CSRF value is short-lived client state for memory-only use and must not be persisted in browser storage.
      security:
        - AdminSession: []
      responses:
        '200':
          description: Session is active and a current CSRF value is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
              examples:
                active:
                  $ref: '#/components/examples/ActiveSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Authentication
      operationId: createAdminSession
      summary: Exchange the Admin Token for a secure browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSessionCreateRequest'
      responses:
        '201':
          description: Session created. The session identifier is set in an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
              examples:
                created:
                  $ref: '#/components/examples/ActiveSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
        - Authentication
      operationId: deleteAdminSession
      summary: End the current admin browser session
      security:
        - AdminSession: []
          AdminCsrf: []
      responses:
        '204':
          description: Session ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
  /api/v1/admin/app-credential:
    get:
      tags:
        - Authentication
      operationId: getAppCredentialStatus
      summary: Read App Token metadata without exposing the token value
      security:
        - AdminSession: []
      responses:
        '200':
          description: App credential metadata; never the token value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCredentialStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Authentication
      operationId: rotateAppCredential
      summary: Rotate the App Token, invalidating the previous token and returning the new value once
      description: Immediately revokes all active App Tokens and issues one new token. Server-side work is not cancelled. The new plaintext token is returned exactly once and cannot be read again.
      security:
        - AdminSession: []
          AdminCsrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: New App Token returned once; the previous token is invalid immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCredentialRotation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
  /api/v1/uploads:
    post:
      tags:
        - Uploads
      operationId: createUploadSession
      summary: Create a resumable upload session
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreateRequest'
      responses:
        '201':
          description: Upload session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '507':
          $ref: '#/components/responses/StorageBlocked'
  /api/v1/uploads/{upload_id}:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Uploads
      operationId: getUploadSession
      summary: Read resumable upload progress
      security:
        - AppBearer: []
      responses:
        '200':
          description: Current upload state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
        - Uploads
      operationId: cancelUploadSession
      summary: Cancel an incomplete upload and discard temporary bytes
      security:
        - AppBearer: []
      responses:
        '200':
          description: Upload cancelled or already terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/uploads/{upload_id}/content:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    patch:
      tags:
        - Uploads
      operationId: appendUploadContent
      summary: Append bytes at the server-confirmed upload offset
      security:
        - AppBearer: []
      parameters:
        - name: Upload-Offset
          in: header
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Bytes appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadChunkResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/UploadOffsetConflict'
        '507':
          $ref: '#/components/responses/StorageBlocked'
  /api/v1/uploads/{upload_id}/complete:
    parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Uploads
      operationId: completeUploadSession
      summary: Validate uploaded content and create or rehydrate its logical Asset
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCompleteRequest'
      responses:
        '201':
          description: Upload completed and a new or rehydrated Asset returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/InvalidImage'
        '507':
          $ref: '#/components/responses/StorageBlocked'
  /api/v1/assets:
    get:
      tags:
        - Assets
      operationId: listAssets
      summary: List reusable person, garment, result, or mask assets
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AssetKind'
      responses:
        '200':
          description: Asset page ordered by created_at and id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/assets/{asset_id}:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Assets
      operationId: getAsset
      summary: Read asset metadata, including deleted-content placeholders
      security:
        - AppBearer: []
      responses:
        '200':
          description: Asset metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags:
        - Assets
      operationId: updateAsset
      summary: Update mutable asset metadata
      description: V1 Phase 2 permits only favorite-state changes.
      security:
        - AppBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetUpdateRequest'
      responses:
        '200':
          description: Updated asset metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
              examples:
                favorite:
                  $ref: '#/components/examples/FavoriteAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/assets/{asset_id}/content:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Assets
      operationId: downloadAssetContent
      summary: Download private asset content through an authenticated endpoint
      security:
        - AppBearer: []
        - AdminSession: []
      responses:
        '200':
          description: Private image bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
    delete:
      tags:
        - Assets
      operationId: deleteAssetContent
      summary: Remove private asset content while retaining a metadata placeholder
      description: The operation is safe to repeat. Active references block deletion and can be inspected through the asset references resource.
      security:
        - AppBearer: []
      responses:
        '200':
          description: Content was deleted or was already absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetContentDeletionResult'
              examples:
                deleted:
                  $ref: '#/components/examples/DeletedContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/AssetReferenced'
  /api/v1/assets/{asset_id}/references:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Assets
      operationId: listAssetReferences
      summary: List active reference blockers for an asset
      description: Results use the shared opaque cursor convention. Source identifiers are resource identifiers, never filesystem paths or content hashes.
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Active reference page in deterministic creation order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetReferencePage'
              examples:
                blockers:
                  $ref: '#/components/examples/ReferencePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/assets/{asset_id}/local-copy:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    put:
      tags:
        - Assets
      operationId: confirmAssetLocalCopy
      summary: Confirm a durable full Android copy of an owned person or garment
      description: Safe to repeat with the same client material identifier and digest. The acknowledgement permits later reference-aware input-content cleanup but does not itself delete content or start a grace period.
      security:
        - AppBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetLocalCopyAcknowledgement'
      responses:
        '200':
          description: Durable local copy acknowledged; current asset state returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/jobs:
    get:
      tags:
        - Jobs
      operationId: listJobs
      summary: List jobs ordered by created_at and id
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/JobState'
      responses:
        '200':
          description: Job page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Jobs
      operationId: createJob
      summary: Create a try-on job and lock generation configuration versions
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Persisted job, including locked Provider and Workflow references.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TryOnJob'
              examples:
                waitingProvider:
                  $ref: '#/components/examples/WaitingProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ProviderNotUsable'
        '422':
          $ref: '#/components/responses/Problem'
        '507':
          $ref: '#/components/responses/StorageBlocked'
  /api/v1/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Jobs
      operationId: getJob
      summary: Read authoritative job, item, output, and locked-version state
      security:
        - AppBearer: []
      responses:
        '200':
          description: Job details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TryOnJob'
              examples:
                queuedStorageBlocked:
                  $ref: '#/components/examples/QueuedStorageBlocked'
                waitingProvider:
                  $ref: '#/components/examples/WaitingProvider'
                running:
                  $ref: '#/components/examples/Running'
                succeeded:
                  $ref: '#/components/examples/Succeeded'
                partiallySucceeded:
                  $ref: '#/components/examples/PartiallySucceeded'
                needsAttention:
                  $ref: '#/components/examples/NeedsAttention'
                cancelled:
                  $ref: '#/components/examples/Cancelled'
                retryLineage:
                  $ref: '#/components/examples/RetryLineage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/jobs/{job_id}/cancel:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Jobs
      operationId: cancelJob
      summary: Best-effort cancel every unfinished candidate while retaining successful outputs
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated aggregate job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCommandResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/JobStateConflict'
  /api/v1/job-items/{job_item_id}:
    parameters:
      - name: job_item_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    get:
      tags:
        - Jobs
      operationId: getJobItem
      summary: Read one candidate execution and its immutable attempt lineage
      security:
        - AppBearer: []
      responses:
        '200':
          description: Job item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/job-items/{job_item_id}/cancel:
    parameters:
      - name: job_item_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Jobs
      operationId: cancelJobItem
      summary: Best-effort cancel one unfinished candidate without affecting others
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Updated aggregate job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCommandResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/JobStateConflict'
  /api/v1/job-items/{job_item_id}/retry:
    parameters:
      - name: job_item_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Jobs
      operationId: retryJobItem
      summary: Create a new traceable JobItem attempt without overwriting the original
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryJobItemRequest'
      responses:
        '201':
          description: New JobItem created in queued state and aggregate job recalculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCommandResult'
              examples:
                retryCommandResult:
                  $ref: '#/components/examples/RetryCommandResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/JobStateConflict'
  /api/v1/job-items/{job_item_id}/requery:
    parameters:
      - name: job_item_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Jobs
      operationId: requeryJobItem
      summary: Requery an uncertain external execution without starting a new one
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Job synchronized with the known external state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCommandResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/JobStateConflict'
  /api/v1/job-items/{job_item_id}/finish-failed:
    parameters:
      - name: job_item_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
    post:
      tags:
        - Jobs
      operationId: finishJobItemAsFailed
      summary: End needs_attention processing as a retained failure
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishFailedRequest'
      responses:
        '200':
          description: JobItem ended as failed and aggregate job recalculated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCommandResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/JobStateConflict'
  /api/v1/providers:
    get:
      tags:
        - Providers
      operationId: listAvailableProviders
      summary: List providers and capability snapshots available for new jobs
      security:
        - AppBearer: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Provider page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPage'
              examples:
                availableProviders:
                  $ref: '#/components/examples/AvailableProviderPage'
                temporarilyOfflineProviders:
                  $ref: '#/components/examples/TemporarilyOfflineProviderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/provider-configs:
    get:
      tags:
        - Providers
      operationId: listProviderConfigs
      summary: List redacted provider configurations
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Provider configuration page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConfigPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Providers
      operationId: createProviderConfig
      summary: Save a new inactive provider configuration without changing the default
      security:
        - AdminSession: []
          AdminCsrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
