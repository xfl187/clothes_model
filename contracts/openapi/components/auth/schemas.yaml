AdminSessionCreateRequest:
  type: object
  additionalProperties: false
  required: [admin_token]
  properties:
    admin_token:
      type: string
      minLength: 32
      writeOnly: true

AdminSession:
  type: object
  additionalProperties: false
  required: [authenticated, csrf_token, created_at, expires_at]
  properties:
    authenticated:
      type: boolean
      enum: [true]
    csrf_token:
      type: string
      readOnly: true
      minLength: 32
      description: >-
        Returned by session creation or inspection and required for subsequent
        admin writes. Web clients keep it in memory only.
    created_at:
      $ref: ../common/schemas.yaml#/Timestamp
    expires_at:
      $ref: ../common/schemas.yaml#/Timestamp

AppAuthStatus:
  type: object
  additionalProperties: false
  required: [authenticated, token_id, server_time]
  properties:
    authenticated:
      type: boolean
      enum: [true]
    token_id:
      type: string
      description: Non-secret token identifier; never the token value.
    server_instance_id:
      type: string
      format: uuid
      readOnly: true
      description: >-
        Stable opaque identity for this Backend installation. Local clients use it
        only as a partition key and must not derive trust from its value.
    owner_scope_id:
      type: string
      format: uuid
      readOnly: true
      description: >-
        Stable opaque material-owner scope associated with the App credential.
        It is independent of token rotation and reserves future account isolation.
    server_time:
      $ref: ../common/schemas.yaml#/Timestamp
