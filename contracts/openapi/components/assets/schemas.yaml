UploadState:
  type: string
  enum: [created, uploading, completed, failed, cancelled, unknown]

AssetKind:
  type: string
  enum: [person, garment, generated_output, mask, workflow_file, unknown]

GarmentCategory:
  type: string
  enum: [upper_body, lower_body, dress, unknown]

GarmentSource:
  type: string
  enum: [photo, screenshot, product_image, experimental, unknown]

UploadCreateRequest:
  type: object
  additionalProperties: false
  required: [asset_kind, filename, content_type, size_bytes]
  properties:
    asset_kind:
      $ref: '#/AssetKind'
    filename:
      type: string
      minLength: 1
      maxLength: 255
    content_type:
      type: string
    size_bytes:
      type: integer
      format: int64
      minimum: 1
    garment_category:
      $ref: '#/GarmentCategory'
    garment_source:
      $ref: '#/GarmentSource'
    target_asset_id:
      allOf:
        - $ref: ../common/schemas.yaml#/Identifier
      description: >-
        Existing owned person or garment logical asset whose absent input content
        will be rehydrated. Omit when creating a new logical asset.

UploadSession:
  type: object
  additionalProperties: false
  required:
    - id
    - state
    - asset_kind
    - filename
    - content_type
    - size_bytes
    - uploaded_bytes
    - created_at
    - expires_at
  properties:
    id:
      $ref: ../common/schemas.yaml#/Identifier
    state:
      $ref: '#/UploadState'
    asset_kind:
      $ref: '#/AssetKind'
    filename:
      type: string
    content_type:
      type: string
    size_bytes:
      type: integer
      format: int64
    uploaded_bytes:
      type: integer
      format: int64
      minimum: 0
    asset_id:
      type: string
      format: uuid
    created_at:
      $ref: ../common/schemas.yaml#/Timestamp
    expires_at:
      $ref: ../common/schemas.yaml#/Timestamp
    error:
      $ref: ../common/schemas.yaml#/ProblemDetails

UploadChunkResult:
  type: object
  additionalProperties: false
  required: [upload_id, state, uploaded_bytes]
  properties:
    upload_id:
      $ref: ../common/schemas.yaml#/Identifier
    state:
      $ref: '#/UploadState'
    uploaded_bytes:
      type: integer
      format: int64
      minimum: 0

UploadCompleteRequest:
  type: object
  additionalProperties: false
  required: [sha256]
  properties:
    sha256:
      type: string
      pattern: ^[A-Fa-f0-9]{64}$

AssetUpdateRequest:
  type: object
  additionalProperties: false
  required: [favorite]
  properties:
    favorite:
      type: boolean

Asset:
  type: object
  additionalProperties: false
  required:
    - id
    - kind
    - content_type
    - size_bytes
    - width
    - height
    - favorite
    - lifecycle
    - created_at
    - content_available
  properties:
    id:
      $ref: ../common/schemas.yaml#/Identifier
    kind:
      $ref: '#/AssetKind'
    content_type:
      type: string
    size_bytes:
      type: integer
      format: int64
    width:
      type: integer
      minimum: 1
    height:
      type: integer
      minimum: 1
    favorite:
      type: boolean
    lifecycle:
      type: string
      enum: [active, deleted_content, expired, unknown]
    created_at:
      $ref: ../common/schemas.yaml#/Timestamp
    content_available:
      type: boolean
    content_sha256:
      type: string
      pattern: ^[A-Fa-f0-9]{64}$
      readOnly: true
      description: Digest of currently available private content, when present.
    durable_client_copy_confirmed:
      type: boolean
      readOnly: true
      description: >-
        Whether an authenticated client has acknowledged a durable full local copy
        that permits automatic cleanup after reference protection and grace time.
    cleanup_after:
      type: string
      format: date-time
      nullable: true
      readOnly: true
      description: Earliest scheduled input-content cleanup time, if one is eligible.
    quality_warnings:
      type: array
      items:
        type: string
    garment_category:
      $ref: '#/GarmentCategory'
    garment_source:
      $ref: '#/GarmentSource'

AssetLocalCopyAcknowledgement:
  type: object
  additionalProperties: false
  required: [client_asset_id, sha256]
  properties:
    client_asset_id:
      type: string
      format: uuid
      description: Opaque Android-local material identifier used for idempotent acknowledgement.
    sha256:
      type: string
      pattern: ^[A-Fa-f0-9]{64}$
      description: Digest verified from the durable Android private copy.

AssetPage:
  type: object
  additionalProperties: false
  required: [items, next_cursor, has_more]
  properties:
    items:
      type: array
      items:
        $ref: '#/Asset'
    next_cursor:
      type: string
      nullable: true
    has_more:
      type: boolean

AssetContentDeletionOutcome:
  type: string
  enum: [content_deleted, already_deleted, unknown]

AssetContentDeletionResult:
  type: object
  additionalProperties: false
  required: [outcome, asset]
  properties:
    outcome:
      $ref: '#/AssetContentDeletionOutcome'
    asset:
      $ref: '#/Asset'

AssetReferenceKind:
  type: string
  description: Stable source family. Unknown values remain safe for older clients.
  enum: [job, job_item, outfit, generated_output, unknown]

AssetReference:
  type: object
  additionalProperties: false
  required: [id, asset_id, source_kind, source_id, active, created_at]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Identifier
    asset_id:
      $ref: ../common/schemas.yaml#/Identifier
    source_kind:
      $ref: '#/AssetReferenceKind'
    source_id:
      $ref: ../common/schemas.yaml#/Identifier
    label:
      type: string
      nullable: true
      maxLength: 200
      description: Safe display label captured by the referencing module.
    active:
      type: boolean
    created_at:
      $ref: ../common/schemas.yaml#/Timestamp

AssetReferencePage:
  type: object
  additionalProperties: false
  required: [items, next_cursor, has_more]
  properties:
    items:
      type: array
      items:
        $ref: '#/AssetReference'
    next_cursor:
      type: string
      nullable: true
    has_more:
      type: boolean
