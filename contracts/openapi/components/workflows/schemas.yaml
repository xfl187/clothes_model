WorkflowState:
  type: string
  enum: [draft, validated, active, retired, unknown]

WorkflowCheckStatus:
  type: string
  enum: [passed, failed, skipped, unknown]

WorkflowCompatibilityState:
  type: string
  enum: [compatible, incompatible, offline, unchecked, unknown]

WorkflowValidationCheck:
  type: object
  additionalProperties: false
  required: [key, status]
  properties:
    key:
      type: string
      description: Stable machine-readable check key.
    status:
      $ref: '#/WorkflowCheckStatus'
    detail:
      type: string
      nullable: true
      description: Safe redacted explanation without Workflow bodies, paths, prompts, or secrets.

WorkflowCompatibilityResult:
  type: object
  additionalProperties: false
  required: [status, checked_at, checks]
  properties:
    status:
      $ref: '#/WorkflowCompatibilityState'
    checked_at:
      $ref: ../common/schemas.yaml#/Timestamp
    observed_server_version:
      type: string
      nullable: true
      description: Safe server version label observed during the compatibility check.
    checks:
      type: array
      items:
        $ref: '#/WorkflowValidationCheck'

WorkflowArtifactMetadata:
  type: object
  additionalProperties: false
  required: [workflow_sha256, manifest_sha256]
  properties:
    workflow_sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    manifest_sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    workflow_size_bytes:
      type: integer
      format: int64
      minimum: 1
    manifest_size_bytes:
      type: integer
      format: int64
      minimum: 1

WorkflowManifestSummary:
  type: object
  additionalProperties: false
  required: [schema_version, binding_keys, output_count]
  properties:
    schema_version:
      type: integer
      minimum: 1
    binding_keys:
      type: array
      uniqueItems: true
      items:
        type: string
    output_count:
      type: integer
      minimum: 1
    capabilities:
      $ref: ../providers/schemas.yaml#/ProviderCapabilities

WorkflowCreateRequest:
  type: object
  additionalProperties: false
  required: [workflow_id, version, mode, workflow_json, manifest]
  properties:
    workflow_id:
      type: string
      minLength: 1
      maxLength: 100
    version:
      type: integer
      minimum: 1
    mode:
      type: string
      enum: [precise_try_on]
    workflow_json:
      type: object
      additionalProperties: true
      description: Immutable ComfyUI API-format workflow JSON.
    manifest:
      type: object
      additionalProperties: true
      description: Versioned bindings, outputs, and declared capabilities.

WorkflowVersion:
  type: object
  additionalProperties: false
  required:
    - id
    - workflow_id
    - version
    - mode
    - state
    - capabilities
    - created_at
  properties:
    id:
      $ref: ../common/schemas.yaml#/Identifier
    workflow_id:
      type: string
    version:
      type: integer
      minimum: 1
    mode:
      type: string
      enum: [precise_try_on]
    state:
      $ref: '#/WorkflowState'
    capabilities:
      $ref: ../providers/schemas.yaml#/ProviderCapabilities
    logical_provider_ref:
      allOf:
        - $ref: ../common/schemas.yaml#/ProviderConfigRef
      description: >-
        Stable logical Comfy Provider revision used for selection and job locking.
        The replaceable physical node endpoint and credential are never part of this reference.
    artifacts:
      $ref: '#/WorkflowArtifactMetadata'
    manifest_summary:
      $ref: '#/WorkflowManifestSummary'
    validation_status:
      type: string
      enum: [not_run, passed, failed]
    validation_messages:
      type: array
      items:
        type: string
    created_at:
      $ref: ../common/schemas.yaml#/Timestamp
    validated_at:
      type: string
      format: date-time
      nullable: true
    activated_at:
      type: string
      format: date-time
      nullable: true
    retired_at:
      type: string
      format: date-time
      nullable: true
    compatibility:
      $ref: '#/WorkflowCompatibilityResult'

WorkflowPage:
  type: object
  additionalProperties: false
  required: [items, next_cursor, has_more]
  properties:
    items:
      type: array
      items:
        $ref: '#/WorkflowVersion'
    next_cursor:
      type: string
      nullable: true
    has_more:
      type: boolean

WorkflowValidationResult:
  type: object
  additionalProperties: false
  required: [status, checked_at, checks]
  properties:
    status:
      type: string
      enum: [passed, failed]
    checked_at:
      $ref: ../common/schemas.yaml#/Timestamp
    checks:
      type: array
      items:
        $ref: '#/WorkflowValidationCheck'
    compatibility:
      $ref: '#/WorkflowCompatibilityResult'

WorkflowActivateRequest:
  type: object
  additionalProperties: false
  required: [confirm_new_jobs_only]
  properties:
    confirm_new_jobs_only:
      type: boolean
      enum: [true]
      description: Confirms that activation affects new jobs only.
    expected_current_active_workflow_version_id:
      type: string
      format: uuid
      nullable: true
      description: Optional optimistic guard against activating over an unexpected current version.
    reason:
      type: string
      maxLength: 500
      nullable: true
      description: Safe operator reason retained as audit metadata.

WorkflowRetireRequest:
  type: object
  additionalProperties: false
  required: [confirm_new_jobs_only]
  properties:
    confirm_new_jobs_only:
      type: boolean
      enum: [true]
      description: Confirms that retiring the active version affects new jobs only.
    reason:
      type: string
      maxLength: 500
      nullable: true
      description: Safe operator reason retained as audit metadata.
