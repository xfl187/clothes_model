Collection:
  get:
    tags: [Assets]
    operationId: listAssets
    summary: List reusable person, garment, result, or mask assets
    security:
      - AppBearer: []
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/Cursor
      - $ref: ../openapi.yaml#/components/parameters/Limit
      - name: kind
        in: query
        required: false
        schema:
          $ref: ../components/assets/schemas.yaml#/AssetKind
    responses:
      '200':
        description: Asset page ordered by created_at and id.
        content:
          application/json:
            schema:
              $ref: ../components/assets/schemas.yaml#/AssetPage
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
Item:
  parameters:
    - name: asset_id
      in: path
      required: true
      schema:
        $ref: ../components/common/schemas.yaml#/Identifier
  get:
    tags: [Assets]
    operationId: getAsset
    summary: Read asset metadata, including deleted-content placeholders
    security:
      - AppBearer: []
    responses:
      '200':
        description: Asset metadata.
        content:
          application/json:
            schema:
              $ref: ../components/assets/schemas.yaml#/Asset
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/Problem
  patch:
    tags: [Assets]
    operationId: updateAsset
    summary: Update mutable asset metadata
    description: V1 Phase 2 permits only favorite-state changes.
    security:
      - AppBearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/assets/schemas.yaml#/AssetUpdateRequest
    responses:
      '200':
        description: Updated asset metadata.
        content:
          application/json:
            schema:
              $ref: ../components/assets/schemas.yaml#/Asset
            examples:
              favorite:
                $ref: ../examples/assets.yaml#/FavoriteAsset
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/Problem
      '422':
        $ref: ../openapi.yaml#/components/responses/Problem
Content:
  parameters:
    - name: asset_id
      in: path
      required: true
      schema:
        $ref: ../components/common/schemas.yaml#/Identifier
  get:
    tags: [Assets]
    operationId: downloadAssetContent
    summary: Download private asset content through an authenticated endpoint
    security:
      - AppBearer: []
      - AdminSession: []
    responses:
      '200':
        description: Private image bytes.
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/Problem
  delete:
    tags: [Assets]
    operationId: deleteAssetContent
    summary: Remove private asset content while retaining a metadata placeholder
    description: >-
      The operation is safe to repeat. Active references block deletion and can
      be inspected through the asset references resource.
    security:
      - AppBearer: []
    responses:
      '200':
        description: Content was deleted or was already absent.
        content:
          application/json:
            schema:
              $ref: ../components/assets/schemas.yaml#/AssetContentDeletionResult
            examples:
              deleted:
                $ref: ../examples/assets.yaml#/DeletedContent
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/Problem
      '409':
        $ref: ../openapi.yaml#/components/responses/AssetReferenced
References:
  parameters:
    - name: asset_id
      in: path
      required: true
      schema:
        $ref: ../components/common/schemas.yaml#/Identifier
  get:
    tags: [Assets]
    operationId: listAssetReferences
    summary: List active reference blockers for an asset
    description: >-
      Results use the shared opaque cursor convention. Source identifiers are
      resource identifiers, never filesystem paths or content hashes.
    security:
      - AppBearer: []
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/Cursor
      - $ref: ../openapi.yaml#/components/parameters/Limit
    responses:
      '200':
        description: Active reference page in deterministic creation order.
        content:
          application/json:
            schema:
              $ref: ../components/assets/schemas.yaml#/AssetReferencePage
            examples:
              blockers:
                $ref: ../examples/assets.yaml#/ReferencePage
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/Problem
LocalCopy:
  parameters:
    - name: asset_id
      in: path
      required: true
      schema:
        $ref: ../components/common/schemas.yaml#/Identifier
  put:
    tags: [Assets]
    operationId: confirmAssetLocalCopy
    summary: Confirm a durable full Android copy of an owned person or garment
    description: >-
      Safe to repeat with the same client material identifier and digest. The
      acknowledgement permits later reference-aware input-content cleanup but
      does not itself delete content or start a grace period.
    security:
      - AppBearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/assets/schemas.yaml#/AssetLocalCopyAcknowledgement
    responses:
      '200':
        description: Durable local copy acknowledged; current asset state returned.
        content:
          application/json:
            schema:
              $ref: ../components/assets/schemas.yaml#/Asset
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/Problem
      '409':
        $ref: ../openapi.yaml#/components/responses/Problem
      '422':
        $ref: ../openapi.yaml#/components/responses/Problem
