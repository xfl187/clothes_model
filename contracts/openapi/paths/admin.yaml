DefaultProvider:
  get:
    tags: [Admin Configuration]
    operationId: getDefaultProviderConfiguration
    summary: Read the Provider selection applied to new jobs
    security:
      - AdminSession: []
    responses:
      '200':
        description: Current default Provider configuration.
        content:
          application/json:
            schema:
              $ref: ../components/admin/schemas.yaml#/DefaultProviderConfiguration
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
  put:
    tags: [Admin Configuration]
    operationId: updateDefaultProviderConfiguration
    summary: Change the default for new jobs without modifying existing locked jobs
    security:
      - AdminSession: []
        AdminCsrf: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/admin/schemas.yaml#/DefaultProviderUpdateRequest
    responses:
      '200':
        description: Default Provider updated for new jobs only.
        content:
          application/json:
            schema:
              $ref: ../components/admin/schemas.yaml#/DefaultProviderConfiguration
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '409':
        $ref: ../openapi.yaml#/components/responses/Problem
ComfyNode:
  get:
    tags: [Admin Configuration]
    operationId: getComfyNodeConfiguration
    summary: Read the single redacted ComfyUI node configuration
    security:
      - AdminSession: []
    responses:
      '200':
        description: Redacted node configuration.
        content:
          application/json:
            schema:
              $ref: ../components/admin/schemas.yaml#/ComfyNodeConfiguration
            examples:
              healthy:
                $ref: ../examples/workflows.yaml#/HealthyNode
              offline:
                $ref: ../examples/workflows.yaml#/OfflineNode
              incompatible:
                $ref: ../examples/workflows.yaml#/IncompatibleNode
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
  put:
    tags: [Admin Configuration]
    operationId: updateComfyNodeConfiguration
    summary: Replace the single ComfyUI physical-node configuration
    security:
      - AdminSession: []
        AdminCsrf: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/admin/schemas.yaml#/ComfyNodeConfigurationRequest
    responses:
      '200':
        description: Node configuration saved; credentials are not returned.
        content:
          application/json:
            schema:
              $ref: ../components/admin/schemas.yaml#/ComfyNodeConfiguration
            examples:
              healthy:
                $ref: ../examples/workflows.yaml#/HealthyNode
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
TestComfyNode:
  post:
    tags: [Admin Configuration]
    operationId: testComfyNodeConnection
    summary: Test connectivity without enabling the node or changing locked jobs
    security:
      - AdminSession: []
        AdminCsrf: []
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    responses:
      '200':
        description: Connection test result.
        content:
          application/json:
            schema:
              $ref: ../components/admin/schemas.yaml#/ConnectionTestResult
            examples:
              passed:
                summary: Physical node is reachable; Workflow compatibility is reported separately
                value:
                  status: passed
                  checked_at: '2026-09-28T08:00:00Z'
                  detail: ComfyUI 节点连接正常。
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
Retention:
  get:
    tags: [Admin Configuration]
    operationId: getRetentionPolicy
    summary: Read runtime retention policy
    security:
      - AdminSession: []
    responses:
      '200':
        description: Current retention policy.
        content:
          application/json:
            schema:
              $ref: ../components/admin/schemas.yaml#/RetentionPolicy
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
  put:
    tags: [Admin Configuration]
    operationId: updateRetentionPolicy
    summary: Update future cleanup eligibility rules
    security:
      - AdminSession: []
        AdminCsrf: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/admin/schemas.yaml#/RetentionPolicyUpdateRequest
    responses:
      '200':
        description: Retention policy updated.
        content:
          application/json:
            schema:
              $ref: ../components/admin/schemas.yaml#/RetentionPolicy
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
SystemOverview:
  get:
    tags: [Admin Configuration]
    operationId: getSystemOverview
    summary: Aggregate dependency health, run blockers, action items, and effective configuration
    security:
      - AdminSession: []
    responses:
      '200':
        description: System overview snapshot with real, degraded, or partial dependency conclusions.
        content:
          application/json:
            schema:
              $ref: ../components/admin/schemas.yaml#/SystemOverview
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
