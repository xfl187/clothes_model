Collection:
  get:
    tags: [Workflows]
    operationId: listWorkflowVersions
    summary: List immutable Workflow versions
    security:
      - AdminSession: []
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/Cursor
      - $ref: ../openapi.yaml#/components/parameters/Limit
    responses:
      '200':
        description: Workflow version page.
        content:
          application/json:
            schema:
              $ref: ../components/workflows/schemas.yaml#/WorkflowPage
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
  post:
    tags: [Workflows]
    operationId: createWorkflowVersion
    summary: Upload a new immutable draft Workflow version
    security:
      - AdminSession: []
        AdminCsrf: []
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/workflows/schemas.yaml#/WorkflowCreateRequest
    responses:
      '201':
        description: Draft Workflow version created; existing versions are unchanged.
        content:
          application/json:
            schema:
              $ref: ../components/workflows/schemas.yaml#/WorkflowVersion
            examples:
              draft:
                $ref: ../examples/workflows.yaml#/DraftWorkflow
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '409':
        $ref: ../openapi.yaml#/components/responses/Problem
      '422':
        $ref: ../openapi.yaml#/components/responses/Problem
      '507':
        $ref: ../openapi.yaml#/components/responses/StorageBlocked
Item:
  parameters:
    - name: workflow_version_id
      in: path
      required: true
      schema:
        $ref: ../components/common/schemas.yaml#/Identifier
  get:
    tags: [Workflows]
    operationId: getWorkflowVersion
    summary: Read an immutable Workflow version and its validation state
    security:
      - AdminSession: []
    responses:
      '200':
        description: Workflow version.
        content:
          application/json:
            schema:
              $ref: ../components/workflows/schemas.yaml#/WorkflowVersion
            examples:
              active:
                $ref: ../examples/workflows.yaml#/ActiveWorkflow
              retired:
                $ref: ../examples/workflows.yaml#/RetiredWorkflow
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/Problem
Validate:
  parameters:
    - name: workflow_version_id
      in: path
      required: true
      schema:
        $ref: ../components/common/schemas.yaml#/Identifier
  post:
    tags: [Workflows]
    operationId: validateWorkflowVersion
    summary: Validate bindings, capabilities, compatibility, and minimal test execution
    security:
      - AdminSession: []
        AdminCsrf: []
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    responses:
      '200':
        description: Workflow validation result.
        content:
          application/json:
            schema:
              $ref: ../components/workflows/schemas.yaml#/WorkflowValidationResult
            examples:
              incompatibleNode:
                $ref: ../examples/workflows.yaml#/IncompatibleValidation
              offlineNode:
                $ref: ../examples/workflows.yaml#/OfflineValidation
              failedValidation:
                $ref: ../examples/workflows.yaml#/FailedValidation
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/Problem
      '409':
        $ref: ../openapi.yaml#/components/responses/Problem
      '422':
        $ref: ../openapi.yaml#/components/responses/Problem
      '507':
        $ref: ../openapi.yaml#/components/responses/StorageBlocked
Activate:
  parameters:
    - name: workflow_version_id
      in: path
      required: true
      schema:
        $ref: ../components/common/schemas.yaml#/Identifier
  post:
    tags: [Workflows]
    operationId: activateWorkflowVersion
    summary: Activate or roll back to a compatible validated version for new jobs
    description: >-
      Activating a validated draft, validated version, or previously retired immutable version
      atomically retires the prior active version for the same mode. This is the rollback
      operation. Existing jobs retain their locked Provider and Workflow versions.
    security:
      - AdminSession: []
        AdminCsrf: []
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/workflows/schemas.yaml#/WorkflowActivateRequest
    responses:
      '200':
        description: Workflow version activated; existing jobs retain their locked version.
        content:
          application/json:
            schema:
              $ref: ../components/workflows/schemas.yaml#/WorkflowVersion
            examples:
              active:
                $ref: ../examples/workflows.yaml#/ActiveWorkflow
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/Problem
      '409':
        $ref: ../openapi.yaml#/components/responses/Problem

Retire:
  parameters:
    - name: workflow_version_id
      in: path
      required: true
      schema:
        $ref: ../components/common/schemas.yaml#/Identifier
  post:
    tags: [Workflows]
    operationId: retireWorkflowVersion
    summary: Retire an active or validated Workflow for future jobs without changing history
    description: >-
      Retirement prevents the version from being selected for new jobs. Existing jobs keep
      their locked Workflow and may continue on a compatible replacement physical node.
      A retired immutable version may later be activated again as an explicit rollback.
    security:
      - AdminSession: []
        AdminCsrf: []
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/workflows/schemas.yaml#/WorkflowRetireRequest
    responses:
      '200':
        description: Workflow retired for future jobs only.
        content:
          application/json:
            schema:
              $ref: ../components/workflows/schemas.yaml#/WorkflowVersion
            examples:
              retired:
                $ref: ../examples/workflows.yaml#/RetiredWorkflow
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/Problem
      '409':
        $ref: ../openapi.yaml#/components/responses/Problem
