AppAuthStatus:
  get:
    tags: [Authentication]
    operationId: getAppAuthStatus
    summary: Validate the App Token without returning secret material
    security:
      - AppBearer: []
    responses:
      '200':
        description: App Token is valid.
        content:
          application/json:
            schema:
              $ref: ../components/auth/schemas.yaml#/AppAuthStatus
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
AdminSession:
  get:
    tags: [Authentication]
    operationId: getAdminSession
    summary: Restore an authenticated Admin browser session and refresh its CSRF value
    description: >-
      Uses the HttpOnly session cookie. The returned CSRF value is short-lived
      client state for memory-only use and must not be persisted in browser
      storage.
    security:
      - AdminSession: []
    responses:
      '200':
        description: Session is active and a current CSRF value is returned.
        content:
          application/json:
            schema:
              $ref: ../components/auth/schemas.yaml#/AdminSession
            examples:
              active:
                $ref: ../examples/auth.yaml#/ActiveSession
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
  post:
    tags: [Authentication]
    operationId: createAdminSession
    summary: Exchange the Admin Token for a secure browser session
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/auth/schemas.yaml#/AdminSessionCreateRequest
    responses:
      '201':
        description: Session created. The session identifier is set in an HttpOnly cookie.
        headers:
          Set-Cookie:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/auth/schemas.yaml#/AdminSession
            examples:
              created:
                $ref: ../examples/auth.yaml#/ActiveSession
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '429':
        $ref: ../openapi.yaml#/components/responses/RateLimited
  delete:
    tags: [Authentication]
    operationId: deleteAdminSession
    summary: End the current admin browser session
    security:
      - AdminSession: []
        AdminCsrf: []
    responses:
      '204':
        description: Session ended.
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/CsrfRejected
