name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_seedream_smoke:
        description: Run one billable credentialed Seedream generation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: contracts/tooling/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14.7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: 0.12.18
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Install locked dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm@10.34.5 --dir contracts/tooling install --frozen-lockfile
          uv sync --project backend --locked

      - name: Record tool versions
        shell: bash
        run: |
          mkdir -p artifacts
          {
            node --version
            corepack pnpm@10.34.5 --version
            python --version
            uv --version
            java -version
            android/gradlew --version
          } 2>&1 | tee artifacts/contract-versions.log

      - name: Verify contract generation and consumers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          ./contracts/tooling/verify-generated.ps1 *>&1 |
            Tee-Object -FilePath artifacts/contract-verification.log

      - name: Verify Phase 2 contract boundaries
        shell: pwsh
        run: ./contracts/tooling/verify-phase2-boundaries.ps1

      - name: Verify Phase 3 contract boundaries
        shell: pwsh
        run: ./contracts/tooling/verify-phase3-boundaries.ps1

      - name: Verify Phase 5 contract boundaries
        shell: pwsh
        run: ./contracts/tooling/verify-phase5-boundaries.ps1

      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-reports
          path: artifacts/contract-*.log
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14.7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: 0.12.18
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --project backend --locked

      - name: Record tool versions
        working-directory: backend
        run: |
          mkdir -p artifacts
          {
            python --version
            uv --version
            uv run python -c "import fastapi, pydantic, sqlalchemy; print(f'fastapi={fastapi.__version__} pydantic={pydantic.__version__} sqlalchemy={sqlalchemy.__version__}')"
          } 2>&1 | tee artifacts/backend-versions.log

      - name: Lint
        working-directory: backend
        run: uv run ruff check . 2>&1 | tee artifacts/backend-lint.log

      - name: Type check
        working-directory: backend
        run: uv run pyright 2>&1 | tee artifacts/backend-typecheck.log

      - name: Test
        working-directory: backend
        run: |
          mkdir -p reports
          uv run pytest --junitxml=reports/pytest.xml 2>&1 | tee artifacts/backend-test.log

      - name: Phase 3 verification
        working-directory: backend
        run: |
          uv run pytest \
            tests/test_phase3_persistence.py \
            tests/test_job_state_machine.py \
            tests/test_provider_contract.py \
            tests/test_provider_config_http.py \
            tests/test_jobs_http.py \
            tests/test_scheduler_execution.py \
            tests/test_job_commands.py \
            -q 2>&1 | tee artifacts/backend-phase3.log

      - name: Phase 4 deterministic Provider verification
        working-directory: backend
        run: |
          uv run pytest \
            tests/test_provider_contract.py \
            tests/test_volcengine_ark_adapter.py \
            tests/test_provider_config_http.py \
            tests/test_scheduler_execution.py \
            -q 2>&1 | tee artifacts/backend-phase4.log

      - name: Phase 5 deterministic Comfy verification
        working-directory: backend
        run: |
          uv run pytest \
            tests/test_workflow_artifacts.py \
            tests/test_workflow_lifecycle.py \
            tests/test_comfy_node_http.py \
            tests/test_comfyui_adapter.py \
            tests/test_job_workflow_locking.py \
            tests/test_scheduler_recovery.py \
            -q 2>&1 | tee artifacts/backend-phase5.log

      - name: Build wheel and source distribution
        working-directory: backend
        run: uv build --out-dir artifacts/dist 2>&1 | tee artifacts/backend-build.log

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/reports/
            backend/artifacts/
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web Admin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm@10.34.5 install --frozen-lockfile

      - name: Record tool versions
        run: |
          mkdir -p web-admin/artifacts
          {
            node --version
            corepack pnpm@10.34.5 --version
          } 2>&1 | tee web-admin/artifacts/web-versions.log

      - name: Lint
        run: corepack pnpm@10.34.5 web:lint 2>&1 | tee web-admin/artifacts/web-lint.log

      - name: Type check
        run: corepack pnpm@10.34.5 web:typecheck 2>&1 | tee web-admin/artifacts/web-typecheck.log

      - name: Unit test
        run: corepack pnpm@10.34.5 web:test 2>&1 | tee web-admin/artifacts/web-test.log

      - name: Production build and credential scan
        run: |
          corepack pnpm@10.34.5 web:build 2>&1 | tee web-admin/artifacts/web-build.log
          corepack pnpm@10.34.5 --filter @clothes-model/web-admin check:bundle

      - name: Install Playwright Chromium
        run: corepack pnpm@10.34.5 --filter @clothes-model/web-admin exec playwright install --with-deps chromium

      - name: Browser contract smoke
        run: corepack pnpm@10.34.5 web:test:e2e 2>&1 | tee web-admin/artifacts/web-e2e.log

      - name: Upload Web reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-reports
          path: |
            web-admin/reports/
            web-admin/artifacts/
            web-admin/test-results/
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Record tool versions
        run: |
          mkdir -p android/artifacts
          {
            java -version
            android/gradlew --version
            sdkmanager --version
          } 2>&1 | tee android/artifacts/android-versions.log

      - name: Compile, lint, test, and build variants
        run: |
          android/gradlew -p android --no-daemon --stacktrace --console=plain \
            :core:api-contract:compileKotlin \
            :app:assembleDebug \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest \
            :app:assembleRelease \
            2>&1 | tee android/artifacts/android-build.log

      - name: Verify release boundary
        shell: pwsh
        run: ./android/verify-release-boundary.ps1 *>&1 | Tee-Object -FilePath android/artifacts/android-release-boundary.log

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/artifacts/
            android/**/build/reports/
            android/**/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  android-instrumentation:
    name: Android instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create and start test emulator
        run: |
          mkdir -p android/artifacts
          sdkmanager "platforms;android-37" "build-tools;36.0.0" \
            "system-images;android-34;google_apis;x86_64"
          echo no | avdmanager create avd --force --name phase2-ci \
            --package "system-images;android-34;google_apis;x86_64"
          nohup emulator -avd phase2-ci -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect \
            > android/artifacts/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              adb shell input keyevent 82
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run device security and persistence tests
        run: |
          android/gradlew -p android --no-daemon --stacktrace --console=plain \
            :app:connectedDebugAndroidTest \
            2>&1 | tee android/artifacts/android-instrumentation.log

      - name: Stop emulator
        if: always()
        run: adb emu kill || true

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-reports
          path: |
            android/artifacts/
            android/**/build/reports/androidTests/
            android/**/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  deployment:
    name: Deployment smoke
    runs-on: ubuntu-latest
    needs: [backend, web, android]
    timeout-minutes: 30
    env:
      CLOTHES_MODEL_ENCRYPTION_MASTER_KEY_FILE_SOURCE: ../artifacts/encryption_master_key
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Record container runtime versions
        run: |
          mkdir -p artifacts
          printf 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' > artifacts/encryption_master_key
          {
            docker version
            docker compose version
          } 2>&1 | tee artifacts/deployment-versions.log

      - name: Validate production service boundary
        run: |
          docker compose -f infra/compose.yaml --profile contract --profile development --profile production config --quiet
          services="$(docker compose -f infra/compose.yaml --profile production config --services)"
          test "$services" = $'app\ncaddy'

      - name: Clean-build deployment images
        run: |
          docker compose -f infra/compose.yaml --profile contract --profile production \
            build --no-cache contract-mock app 2>&1 | tee artifacts/deployment-build.log

      - name: Start production profile
        run: docker compose -f infra/compose.yaml --profile production up -d --no-build

      - name: Verify fresh auth, restart, resumable upload, private asset, and Web shell
        shell: pwsh
        run: ./infra/verify-phase2-deployment.ps1 *>&1 | Tee-Object -FilePath artifacts/deployment-smoke.log

      - name: Verify production security boundary
        shell: pwsh
        run: ./infra/verify-phase8-deployment.ps1 *>&1 | Tee-Object -FilePath artifacts/deployment-security.log

      - name: Capture deployment logs
        if: always()
        run: docker compose -f infra/compose.yaml --profile production logs --no-color > artifacts/deployment-compose.log 2>&1

      - name: Upload deployment reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-reports
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Stop deployment
        if: always()
        run: docker compose -f infra/compose.yaml --profile contract --profile production down --volumes --remove-orphans

  phase2-exit:
    name: Phase 4 deterministic exit matrix
    if: always()
    needs: [contract, backend, web, android, android-instrumentation, deployment]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Phase 2 verification boundary
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON"
          test "$(echo "$NEEDS_JSON" | jq -r '[.[].result] | all(. == "success")')" = "true"

  seedream-credentialed-smoke:
    name: Seedream one-image credentialed smoke
    if: github.event_name == 'workflow_dispatch' && inputs.run_seedream_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: phase4-credentialed-smoke
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14.7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: 0.12.18
      - name: Install locked Backend dependencies
        run: uv sync --project backend --locked
      - name: Run exactly one billable generation
        working-directory: backend
        env:
          CLOTHES_MODEL_PHASE4_ARK_API_KEY: ${{ secrets.VOLCENGINE_ARK_API_KEY }}
        run: uv run python scripts/credentialed_seedream_smoke.py

  backup-restore:
    name: Backup and restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14.7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: 0.12.18
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked Backend dependencies
        run: uv sync --project backend --locked

      - name: Verify consistent backup and restore
        shell: pwsh
        run: ./infra/verify-backup-restore.ps1 -Python backend/.venv/bin/python

  phase8-exit:
    name: Phase 8 V1 release gate
    if: always()
    needs: [contract, backend, web, android, android-instrumentation, deployment, backup-restore]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Phase 8 verification boundary
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON"
          test "$(echo "$NEEDS_JSON" | jq -r '[.[].result] | all(. == "success")')" = "true"

  phase9-outfits:
    name: V1.1 layered outfits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14.7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: 0.12.18
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked Backend dependencies
        run: uv sync --project backend --locked

      - name: Outfit Backend verification
        working-directory: backend
        run: |
          uv run pytest \
            tests/test_outfits_http.py \
            tests/test_outfits_layers.py \
            tests/test_migrations.py \
            tests/test_architecture.py \
            tests/test_contract_routes.py \
            -q

  phase9-exit:
    name: Phase 9 V1.1 gate
    if: always()
    needs: [contract, backend, web, android, android-instrumentation, phase9-outfits]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Phase 9 verification boundary
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON"
          test "$(echo "$NEEDS_JSON" | jq -r '[.[].result] | all(. == "success")')" = "true"
