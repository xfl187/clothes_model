[project]
name = "clothes-model-backend"
version = "0.1.0"
description = "Backend engineering skeleton for Clothes Model"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "fastapi>=0.141,<0.142",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.35,<0.36",
  "httpx2>=2,<3",
  "pyright>=1.1.405,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clothes_model"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["src/clothes_model/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
allowed-confusables = ["，"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
